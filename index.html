        "  ◆ Audio effects: Saturator, Roar, EQ Eight",
        "  ◆ Recording Session into Arrangement",
        "  ◆ The Build and Drop devices (new in Live 12)",
        "  ◆ Automation lanes",
        "  ◆ The four day-one mixing moves",
        "  ◆ Exporting WAV and MP3",
        "",
        "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━",
        "",
        "WHAT TO DO NEXT (REAL ADVICE):",
        "",
        "  1. Open Ableton. Right now. Don't 'study' first.",
        "",
        "  2. Spend 30 minutes just AUDITIONING sounds in",
        "     the browser. No pressure to make anything.",
        "     Build your taste.",
        "",
        "  3. Make a 1-bar drum loop. Just that. Save it.",
        "",
        "  4. Tomorrow, add a bass to that loop.",
        "",
        "  5. Day 3, copy it into Arrangement and try to",
        "     build an intro and a drop.",
        "",
        "  6. Don't try to finish a 'song' for the first",
        "     month. Make 30 sketches. Finish nothing.",
        "     This is how every producer learns.",
        "",
        "Watch Die Sexual interviews. Watch Atari Teenage Riot videos. Steal liberally. Every producer you love started by copying their heroes badly until they accidentally became themselves.",
        "",
        "  > END OF GAME 03",
        "  > GO MAKE NOISE.",
      ],
      choices: [
        { text: "↺ Return to menu", next: "__menu__" },
      ],
      ending: true,
    },
  },
};

// ============================================================
// STATE & PERSISTENCE
// ============================================================

const STORAGE_KEY = "machine_language_completed_v1";

function getCompleted() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return {};
    return JSON.parse(raw);
  } catch (e) {
    return {};
  }
}

function setCompleted(gameId) {
  try {
    const completed = getCompleted();
    completed[gameId] = true;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(completed));
  } catch (e) {}
}

function resetProgress() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (e) {}
}

// ============================================================
// VIEWS
// ============================================================

let currentScreen = "menu";  // "menu" | "game"
let currentGame = null;       // game id
let currentNode = null;       // node id within game
let displayedLines = [];
let isTyping = false;
let typingTimeout = null;
let choicesMade = 0;

const root = document.getElementById("root");

function clearTyping() {
  if (typingTimeout) {
    clearTimeout(typingTimeout);
    typingTimeout = null;
  }
}

function renderMenu() {
  clearTyping();
  currentScreen = "menu";
  const completed = getCompleted();
  const completedCount = Object.keys(completed).length;

  let html = `
    <div class="header">
      <span>● MACHINE_LANGUAGE.exe</span>
      <span class="blink">▮ TRILOGY_v01</span>
    </div>
    <h1 class="menu-title">MACHINE</h1>
    <h1 class="menu-title">LANGUAGE</h1>
    <div class="menu-subtitle">A Music Production Trilogy</div>
    <div class="menu-intro">
      Three short text adventures that teach the foundations of electronic music production — the language (MIDI), the body (rhythm and structure), and the tool (Ableton Live 12 Intro).
      <br><br>
      Each one takes about <strong>15-20 minutes</strong>. You can play them in any order, but they were designed to compound — Game 1 sets up Game 2, which sets up Game 3.
      <br><br>
      Made for anyone who wants to make music that sounds like Atari Teenage Riot kissing Die Sexual on a dancefloor at 3 AM.
    </div>
  `;

  Object.values(GAMES).forEach((game) => {
    const isCompleted = !!completed[game.id];
    html += `
      <button class="game-card ${isCompleted ? 'completed' : ''}" data-game="${game.id}">
        <div class="game-card-header">
          <span>GAME ${game.number} · ${game.runtime}</span>
          <span class="game-card-status">${isCompleted ? '✓ COMPLETED' : '◇ NEW'}</span>
        </div>
        <div class="game-card-title">${game.title}</div>
        <div class="game-card-desc">${game.description}</div>
      </button>
    `;
  });

  html += `
    <div class="footer">
      <span>${completedCount} / 3 ADVENTURES COMPLETED</span>
      ${completedCount > 0 ? '<button class="reset-btn" id="reset-btn">[ Reset Progress ]</button>' : '<span></span>'}
    </div>
  `;

  root.innerHTML = html;

  document.querySelectorAll(".game-card").forEach((card) => {
    card.addEventListener("click", () => {
      startGame(card.dataset.game);
    });
  });

  const resetBtn = document.getElementById("reset-btn");
  if (resetBtn) {
    resetBtn.addEventListener("click", () => {
      if (confirm("Reset all progress? You'll lose your completion checkmarks.")) {
        resetProgress();
        renderMenu();
      }
    });
  }
}

function startGame(gameId) {
  currentScreen = "game";
  currentGame = gameId;
  currentNode = "start";
  choicesMade = 0;
  renderNode();
}

function renderNode() {
  clearTyping();
  const game = STORIES[currentGame];
  const node = game[currentNode];
  if (!node) {
    renderMenu();
    return;
  }

  displayedLines = [];
  isTyping = true;

  const completed = getCompleted();
  if (node.ending && !completed[currentGame]) {
    setCompleted(currentGame);
  }

  drawFrame();

  // Typewriter effect
  let lineIdx = 0;
  const lines = node.text;
  const showLine = () => {
    if (lineIdx >= lines.length) {
      isTyping = false;
      drawFrame();
      return;
    }
    displayedLines.push(lines[lineIdx]);
    const justAdded = lines[lineIdx];
    lineIdx++;
    drawFrame();
    typingTimeout = setTimeout(showLine, justAdded === "" ? 80 : 180);
  };
  typingTimeout = setTimeout(showLine, 100);
}

function drawFrame() {
  const game = STORIES[currentGame];
  const node = game[currentNode];
  const gameMeta = GAMES[currentGame];

  let storyHtml = "";
  displayedLines.forEach((line, idx) => {
    const safeLine = (line === "" ? "\u00A0" : escapeHtml(line));
    storyHtml += `<div class="story-line" style="animation-delay:${idx * 0.02}s">${safeLine}</div>`;
  });
  if (isTyping) {
    storyHtml += `<span class="cursor"></span>`;
  }

  let choicesHtml = "";
  if (!isTyping) {
    choicesHtml = `
      <div class="choices">
        <div class="choices-label">┌─ INPUT REQUIRED ─────────────────────</div>
    `;
    node.choices.forEach((choice, idx) => {
      choicesHtml += `
        <button class="choice-btn" data-next="${choice.next}">
          <span class="choice-num">[${idx + 1}]</span>${escapeHtml(choice.text)}
        </button>
      `;
    });
    choicesHtml += `</div>`;
  } else {
    choicesHtml = `<div class="skip-hint">(tap to skip)</div>`;
  }

  let html = `
    <div class="header">
      <span>● ${gameMeta.title.replace(/ /g, "_")}.exe</span>
      <span class="blink">▮ GAME_${gameMeta.number}</span>
    </div>
    <div class="story" id="story">${storyHtml}</div>
    ${choicesHtml}
    <div class="footer">
      <span>NODE: ${currentNode.toUpperCase()}</span>
      <span>CHOICES: ${choicesMade}</span>
      <a class="menu-link" id="menu-link">← MENU</a>
    </div>
  `;

  root.innerHTML = html;

  document.querySelectorAll(".choice-btn").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const next = btn.dataset.next;
      if (next === "__menu__") {
        renderMenu();
      } else {
        choicesMade++;
        currentNode = next;
        renderNode();
      }
    });
  });

  const menuLink = document.getElementById("menu-link");
  if (menuLink) {
    menuLink.addEventListener("click", (e) => {
      e.stopPropagation();
      if (confirm("Return to menu? Your progress in this adventure will not be saved.")) {
        renderMenu();
      }
    });
  }

  // Tap-to-skip on story area
  const storyEl = document.getElementById("story");
  if (storyEl && isTyping) {
    storyEl.addEventListener("click", skipTyping);
  }
}

function skipTyping() {
  if (!isTyping) return;
  clearTyping();
  const node = STORIES[currentGame][currentNode];
  displayedLines = node.text.slice();
  isTyping = false;
  drawFrame();
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// Allow tapping anywhere on body to skip typing
document.body.addEventListener("click", (e) => {
  if (currentScreen === "game" && isTyping) {
    // Only skip if click wasn't on a button or link
    if (!e.target.closest("button") && !e.target.closest("a")) {
      skipTyping();
    }
  }
});

// Boot
renderMenu();
</script>
</body>
</html>
